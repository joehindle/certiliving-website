{% extends "admin/base.html" %}
{% block content %}

<div class="container admin-page">
  <div class="admin-toolbar">
    <h1>Admin: Listings</h1>
    <div class="admin-actions">
      <a href="{{ url_for('admin.listings_new') }}">+ New listing</a>
      <a href="{{ url_for('admin.logout') }}">Logout</a>
    </div>
  </div>

  <table class="admin-table">
    <tr>
      <th>Title</th><th>City</th><th>Rent</th><th>Actions</th>
    </tr>
    {% for l in listings %}
    <tr>
      <td>{{ l['title'] }}</td>
      <td>{{ l['city'] }}</td>
      <td>&pound;{{ l['rent_pcm'] }}</td>
      <td class="admin-row-actions">
        <a href="{{ url_for('admin.listings_edit', listing_id=l['id']) }}">Edit</a>
        <form method="post" action="{{ url_for('admin.listings_delete', listing_id=l['id']) }}">
          <button type="submit" onclick="return confirm('Delete this listing?')">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>

{% endblock %}
