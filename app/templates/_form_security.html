<div class="honeypot-field" aria-hidden="true" hidden>
  <label>
    <span>Website</span>
    <input name="website" type="text" tabindex="-1" autocomplete="off">
  </label>
</div>

{% if turnstile_enabled and turnstile_site_key %}
  <div class="turnstile-widget">
    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-size="flexible" data-theme="light"></div>
  </div>
{% endif %}
